<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lexicanum Arşivleri</title>
<style>
:root{--bg:#0d0f12;--panel:#15181d;--panel2:#1b1f26;--line:#262b33;--txt:#d8dce2;--dim:#8a929d;--acc:#c9a227;--acc2:#8a6d1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.7 Georgia,'Times New Roman',serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--acc);letter-spacing:.12em;font-variant:small-caps}
header .srv{display:flex;gap:6px}
header .srv button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:4px 12px;cursor:pointer;border-radius:3px;font-family:inherit;font-size:13px}
header .srv button.on{color:var(--acc);border-color:var(--acc2)}
#q{flex:1;min-width:200px;max-width:480px;background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:6px 10px;border-radius:3px;font-family:inherit}
main{flex:1;display:flex;min-height:0}
nav{width:300px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0;flex-shrink:0}
nav .cat{padding:8px 14px 2px;color:var(--acc);font-size:11px;letter-spacing:.15em;text-transform:uppercase}
nav details{margin:0 6px 2px}
nav summary{cursor:pointer;padding:5px 8px;color:var(--txt);font-size:13px;list-style:none;border-radius:3px}
nav summary:hover{background:var(--panel2)}
nav summary::before{content:'▸';color:var(--dim);font-size:10px;margin-right:6px}
nav details[open] summary::before{content:'▾'}
nav .it{padding:3px 8px 3px 24px;font-size:13px;color:var(--dim);cursor:pointer;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .it:hover{background:var(--panel2);color:var(--txt)}
nav .it.on{color:var(--acc);background:var(--panel2)}
nav .grp{padding:6px 14px 2px;color:var(--dim);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
#content{flex:1;overflow-y:auto;padding:28px 36px;max-width:none}
#content .inner{max-width:860px;margin:0 auto}
.md img{max-width:100%;border:1px solid var(--line);border-radius:4px;margin:10px 0}
.md h1{color:var(--acc);font-size:26px;border-bottom:1px solid var(--line);padding-bottom:8px;margin:14px 0 10px}
.md h2{color:var(--acc);font-size:19px;margin:20px 0 8px;font-variant:small-caps;letter-spacing:.06em}
.md h3{color:var(--txt);font-size:16px}
.md .sub{color:var(--dim);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.md blockquote{border-left:2px solid var(--acc2);margin:10px 0;padding:4px 14px;color:var(--dim);background:var(--panel)}
.md code{background:var(--panel2);padding:1px 5px;border-radius:3px;font-size:13px}
.md hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.md a{color:var(--acc)}
.md ul{margin:6px 0;padding-left:22px}
.md li{margin:2px 0}
#res .it{padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
#res .it:hover{background:var(--panel2)}
#res .it b{color:var(--acc);font-weight:normal}
#res .it small{color:var(--dim);display:block}
#res{max-height:60vh;overflow-y:auto;position:absolute;background:var(--panel);border:1px solid var(--line);z-index:9;border-radius:4px;min-width:320px}
.hdr{position:relative}
@media(max-width:800px){nav{display:none}main{flex-direction:column}#content{padding:16px}}
.empty{color:var(--dim);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
<h1>◈ LEXICANUM</h1>
<div class="srv" id="srvs"></div>
<div class="hdr"><input id="q" placeholder="Kayıt ara…" autocomplete="off"><div id="res" style="display:none"></div></div>
</header>
<main>
<nav id="nav"></nav>
<div id="content"><div class="inner empty">Bir kayıt seçin veya arayın.</div></div>
</main>
<script>
let MAN=null,IDX=null,CUR=0;
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function md(src){
  const lines=src.split('\n');let out='',inUl=false,skipImg=null;
  const endUl=()=>{if(inUl){out+='</ul>';inUl=false}};
  for(let ln of lines){
    let t=ln.trimEnd();
    if(!t.trim()){endUl();continue}
    // discord kalıntıları
    if(/^<#\d+>/.test(t))continue;
    if(/^-#\s/.test(t)){endUl();out+='<div class="sub">'+esc(t.slice(3))+'</div>';continue}
    let m;
    if(m=t.match(/^!\[.*?\]\((.+?)\)/)){endUl();out+='<img loading="lazy" src="'+m[1]+'">';continue}
    if(m=t.match(/^(https?:\/\/\S+\.(?:png|jpe?g|webp|gif)[^\s]*)$/i)){endUl();out+='<img loading="lazy" src="'+m[1]+'">';continue}
    if(m=t.match(/^###\s(.+)/)){endUl();out+='<h3>'+inl(m[1])+'</h3>';continue}
    if(m=t.match(/^##\s(.+)/)){endUl();out+='<h2>'+inl(m[1])+'</h2>';continue}
    if(m=t.match(/^#\s(.+)/)){endUl();out+='<h1>'+inl(m[1])+'</h1>';continue}
    if(/^---+$/.test(t)){endUl();out+='<hr>';continue}
    if(m=t.match(/^>\s?(.*)/)){endUl();out+='<blockquote>'+inl(m[1])+'</blockquote>';continue}
    if(m=t.match(/^[-*]\s+(.*)/)){
      if(!inUl){out+='<ul>';inUl=true}
      out+='<li>'+inl(m[1])+'</li>';continue}
    endUl();out+='<p>'+inl(t)+'</p>';
  }
  endUl();
  return out;
}
function inl(s){
  s=esc(s);
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  s=s.replace(/\*(.+?)\*/g,'<i>$1</i>');
  s=s.replace(/`(.+?)`/g,'<code>$1</code>');
  s=s.replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>');
  return s;
}
async function load(u){
  $('#content').innerHTML='<div class="inner empty">Yükleniyor…</div>';
  const r=await fetch(encodeURI(u));
  const t=await r.text();
  $('#content').innerHTML='<div class="inner md">'+md(t)+'</div>';
  $('#content').scrollTop=0;
  document.querySelectorAll('nav .it.on').forEach(e=>e.classList.remove('on'));
}
function buildNav(){
  const s=MAN.servers[CUR],nav=$('#nav');nav.innerHTML='';
  if(s.readme){const d=document.createElement('div');d.className='it';d.textContent='◈ Giriş / README';d.onclick=()=>{load(s.readme);d.classList.add('on')};nav.appendChild(d)}
  for(const f of s.forums){
    if(f.cat){const c=document.createElement('div');c.className='cat';c.textContent=f.cat;nav.appendChild(c)}
    for(const it of f.items){
      const det=document.createElement('details');
      const sm=document.createElement('summary');sm.textContent=it.name+' ('+it.posts.length+')';det.appendChild(sm);
      for(const p of it.posts){
        const d=document.createElement('div');d.className='it';d.textContent=p.title;
        d.onclick=()=>{load(p.file);document.querySelectorAll('nav .it.on').forEach(e=>e.classList.remove('on'));d.classList.add('on')};
        det.appendChild(d);
      }
      nav.appendChild(det);
    }
  }
  if(s.texts.length){
    let last=null;
    for(const t of s.texts){
      const g2=t.grp||'Metin Kanalları';
      if(g2!==last){last=g2;const g=document.createElement('div');g.className='grp';g.textContent=g2;nav.appendChild(g)}
      const d=document.createElement('div');d.className='it';d.textContent=t.title;d.onclick=()=>{load(t.file);d.classList.add('on')};nav.appendChild(d);
    }
  }
}
function norm(s){return s.toLowerCase().replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')}
$('#q').addEventListener('input',e=>{
  const v=norm(e.target.value.trim()),box=$('#res');
  if(v.length<2){box.style.display='none';return}
  const hits=IDX.filter(x=>norm(x.t).includes(v)).slice(0,40);
  box.innerHTML=hits.map(h=>'<div class="it" data-u="'+h.u+'"><b>'+esc(h.t)+'</b><small>'+esc(h.s)+' · '+esc(h.f)+'</small></div>').join('')||'<div class="it">Sonuç yok</div>';
  box.style.display='block';
  box.querySelectorAll('.it[data-u]').forEach(d=>d.onclick=()=>{load(d.dataset.u);box.style.display='none'});
});
document.addEventListener('click',e=>{if(!e.target.closest('.hdr'))$('#res').style.display='none'});
async function go(){
  MAN=await(await fetch('manifest.json')).json();
  IDX=await(await fetch('index.json')).json();
  const bw=$('#srvs');
  MAN.servers.forEach((s,i)=>{
    const b=document.createElement('button');b.textContent=s.title;b.onclick=()=>{CUR=i;buildNav();bw.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
    bw.appendChild(b);
  });
  bw.querySelector('button').classList.add('on');
  buildNav();
  if(MAN.servers[0].readme)load(MAN.servers[0].readme);
}
go();
</script>
</body>
</html>
